<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1222">
  <title>Spark Pets Kiosk</title>
  <link rel="stylesheet" href="/shared/pets.css">
  <link rel="stylesheet" href="/kiosk/kiosk.css">
</head>
<body>
  <!-- One-time device setup -->
  <section id="setup" class="screen" hidden>
    <div class="card setup-card">
      <h1>Set up this kiosk</h1>
      <p>Which pet lives on this device?</p>
      <div class="pet-pick">
        <button type="button" data-pet="cs"><span class="pick-art" data-art="cs"></span>Byte<small>Computer Science</small></button>
        <button type="button" data-pet="ds"><span class="pick-art" data-art="ds"></span>Sigma<small>Data Science</small></button>
      </div>
      <label>Device key <input id="setup-key" autocomplete="off" placeholder="from the server console"></label>
      <p class="hint">Tip: open <code>/kiosk/?pet=cs&amp;key=…</code> to skip this screen.</p>
    </div>
  </section>

  <main id="kiosk" class="screen" hidden>
    <header class="top">
      <div class="who"><strong id="pet-name">Pet</strong> <span id="pet-major"></span></div>
      <div class="lvl"><span id="level">Lv 1</span><div class="xp"><i id="xp-bar"></i></div><span id="points">0 pts</span></div>
      <div class="conn" id="conn" title="Connection to server">●</div>
    </header>

    <div class="stage">
      <div class="pet-wrap" id="pet-art"></div>
      <div class="mood">
        <div class="heart-bar"><i id="happy-bar"></i></div>
        <span id="mood-label">Happy</span>
      </div>
    </div>

    <!-- Idle: waiting for a tap -->
    <section id="idle" class="panel">
      <div class="tap-icon" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2>Tap your student ID to say hi</h2>
      <p class="sub" id="idle-sub">Hold your card against the reader.</p>
      <button id="nfc-start" class="btn ghost" type="button" hidden>Enable phone NFC reader</button>
    </section>

    <!-- Active session -->
    <section id="session" class="panel" hidden>
      <h2 id="greet">Hi!</h2>
      <p class="sub" id="greet-sub"></p>
      <div class="actions" id="actions"></div>
      <div class="session-foot">
        <div class="timer"><i id="session-bar"></i></div>
        <button class="btn ghost" id="done" type="button">I'm done</button>
      </div>
    </section>

    <!-- Messages (errors, celebrations) -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <button id="demo-toggle" class="demo-toggle" type="button" title="Simulate an ID tap">Demo cards</button>
    <aside id="demo" class="demo" hidden>
      <h3>Simulate an NFC tap</h3>
      <div id="demo-cards"></div>
    </aside>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="card modal-card">
      <div class="modal-art" id="modal-art"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <button class="btn" id="modal-ok" type="button">OK</button>
    </div>
  </div>

  <script type="module" src="/kiosk/kiosk.js"></script>
</body>
</html>
